name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      resourceGroup:
        description: Azure resource group name
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: life-insurance-crm-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources
        id: azure
        run: |
          BASE_NAME="licrm-${{ inputs.environment }}"
          ACR_NAME="${BASE_NAME//-/}acr"
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "${{ inputs.resourceGroup }}" --query loginServer -o tsv)"
          CONTAINER_APP_NAME="${BASE_NAME}-api"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$CONTAINER_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        run: |
          az acr login --name "${{ steps.azure.outputs.acr_name }}"
          docker build \
            -f src/Dockerfile \
            -t "${{ steps.azure.outputs.image_tag }}" \
            src
          docker push "${{ steps.azure.outputs.image_tag }}"

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ steps.azure.outputs.container_app_name }}" \
            --resource-group "${{ inputs.resourceGroup }}" \
            --image "${{ steps.azure.outputs.image_tag }}"
