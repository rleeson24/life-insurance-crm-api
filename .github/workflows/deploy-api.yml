name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      resourceGroup:
        description: Azure resource group name
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: life-insurance-crm-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources
        id: azure
        run: |
          set -euo pipefail
          RG="${{ inputs.resourceGroup }}"
          ACR_NAME="$(az acr list --resource-group "$RG" --query "[0].name" -o tsv)"
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "$RG" --query loginServer -o tsv)"
          CONTAINER_APP_NAME="$(az containerapp list --resource-group "$RG" --query "[?contains(name, '-api')].name | [0]" -o tsv)"
          if [ -z "$ACR_NAME" ] || [ -z "$CONTAINER_APP_NAME" ]; then
            echo "Could not find ACR or Container App in $RG. Deploy infrastructure first."
            exit 1
          fi
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$CONTAINER_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        run: |
          az acr login --name "${{ steps.azure.outputs.acr_name }}"
          docker build \
            -f src/Dockerfile \
            -t "${{ steps.azure.outputs.image_tag }}" \
            src
          docker push "${{ steps.azure.outputs.image_tag }}"

      - name: Update Container App (image digest)
        run: |
          set -euo pipefail
          DIGEST="$(az acr repository show \
            --name "${{ steps.azure.outputs.acr_name }}" \
            --image "${{ env.IMAGE_NAME }}:${GITHUB_SHA}" \
            --query digest -o tsv)"
          IMAGE_DIGEST="${{ steps.azure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Deploying $IMAGE_DIGEST"
          az containerapp update \
            --name "${{ steps.azure.outputs.container_app_name }}" \
            --resource-group "${{ inputs.resourceGroup }}" \
            --image "$IMAGE_DIGEST"
