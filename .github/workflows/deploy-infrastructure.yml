name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      resourceGroup:
        description: Azure resource group (rg-bbcrm-dev or rg-bbcrm-prod)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve current container images
        id: images
        run: |
          set -euo pipefail
          RG="${{ inputs.resourceGroup }}"
          ENV="${{ inputs.environment }}"
          api_image="$(az containerapp show --name "bbcrm-${ENV}-api" --resource-group "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)"
          web_image="$(az containerapp show --name "bbcrm-${ENV}-web" --resource-group "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)"
          echo "api_image=${api_image}" >> "$GITHUB_OUTPUT"
          echo "web_image=${web_image}" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ inputs.resourceGroup }}
          deploymentName: main
          template: ./infra/main.bicep
          parameters: ./infra/parameters/${{ inputs.environment }}.bicepparam
          additionalArguments: >-
            --parameters sqlAdministratorLoginPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            ${{ steps.images.outputs.api_image != '' && format('--parameters containerImage={0}', steps.images.outputs.api_image) || '' }}
            ${{ steps.images.outputs.web_image != '' && format('--parameters webContainerImage={0}', steps.images.outputs.web_image) || '' }}

      - name: Show deployment outputs
        run: |
          az deployment group show \
            --resource-group "${{ inputs.resourceGroup }}" \
            --name main \
            --query properties.outputs \
            -o json
